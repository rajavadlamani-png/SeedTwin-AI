services:
  db:
    image: seedtwin-ai-postgres:15-alpine-tls
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
    # Generate a private self-signed server certificate in the persistent data volume
    # so production clients can enforce encrypted PostgreSQL connections.
    command:
      - sh
      - -c
      - |
        if [ ! -s "$PGDATA/server.crt" ] || [ ! -s "$PGDATA/server.key" ]; then
          openssl req -new -x509 -days 3650 -nodes -text -out "$PGDATA/server.crt" -keyout "$PGDATA/server.key" -subj "/CN=seedtwin-db"
          chmod 600 "$PGDATA/server.key"
        fi
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=server.crt -c ssl_key_file=server.key
    volumes:
      - seed_twin_postgres_data:/var/lib/postgresql/data
      - seed_twin_postgres_tls:/var/lib/postgresql/tls
    networks:
      - seedtwin_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Deliberately no host port mapping: PostgreSQL is only reachable on the Docker network.

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a versioned backend image}
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with PostgreSQL credentials, db host, and database name}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to a JSON array or comma-separated list}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seedtwin_private
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - seedtwin_private
    security_opt:
      - no-new-privileges:true

networks:
  seedtwin_private:
    driver: bridge

volumes:
  seed_twin_postgres_data:
  seed_twin_postgres_tls:
